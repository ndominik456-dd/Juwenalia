</html<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juwenalia 26 | Akademia Tarnowska</title>
    <link rel="stylesheet" href="style.css">
    <!-- Ładowanie fontów: Montserrat (nowoczesny) i VT323 (pikselowy styl) -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=VT323&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Sekcja Powitalna -->
    <header class="hero">
        <div class="hero-content">
            <h1 class="main-title"><span class="pixel">juwe</span>nalia<span class="number">26</span></h1>
            
            <div class="event-info">
                <p class="date">23 MAJA</p>
                <p class="location">KAMPUS AKADEMII TARNOWSKIEJ</p>
            </div>

            <div class="countdown" id="countdown">
                Ładowanie zegara...
            </div>

            <a href="#lineup" class="cta-button">ZOBACZ LINE-UP</a>
        </div>
    </header>

    <!-- Sekcja Line-up -->
    <main>
        <section id="lineup" class="section lineup-section">
            <h2 class="section-title">LINE-UP</h2>
            
            <div class="grid-container">
                <!-- Artysta 1 (17:00) -->
                <div class="artist-card">
                    <img src="obraz_2.jpg" alt="Artysta o 17:00">
                    <div class="artist-info">
                        <p class="time">17.00</p>
                    </div>
                </div>

                <!-- Artystka 2 (19:00) -->
                <div class="artist-card">
                    <img src="obraz_3.jpg" alt="Artystka o 19:00">
                    <div class="artist-info">
                        <p class="time">19.00</p>
                    </div>
                </div>

                <!-- Artysta 3 (20:30) -->
                <div class="artist-card">
                    <img src="obraz.jpg" alt="Artysta o 20:30">
                    <div class="artist-info">
                        <p class="time">20.30</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Stopka -->
    <footer>
        <p class="footer-motto">TARNÓWSKIE AKADEMIA DLA TARNOWA</p>
        <p class="footer-copy">&copy; 2026 Akademia Tarnowska</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
